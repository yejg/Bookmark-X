import org.jetbrains.intellij.tasks.RunPluginVerifierTask.FailureLevel

plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.13.3'
}

group 'indi.bookmarkx'

version '3.0.1'

sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenLocal()
    maven { url 'https://mirrors.huaweicloud.com/repository/maven/' }
    maven { url 'https://maven.aliyun.com/repository/central/' }  // 阿里云中央仓库镜像
    mavenCentral()
//    maven { url "https://cache-redirector.jetbrains.com/intellij-repository/releases" }
//    maven { url "https://cache-redirector.jetbrains.com/intellij-repository/snapshots" }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-core:1.1.1'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:1.1.1'
    implementation 'org.eclipse.jetty:jetty-server:12.1.9'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.9'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    // https://mvnrepository.com/artifact/org.mockito/mockito-all
    testImplementation 'org.mockito:mockito-all:1.10.19'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version = '2022.3.3'
//    version = '2023.3.6'
//    version = '2024.3.7'
    // Git4Idea 是 IDE 内置插件，这里只为编译期提供 git4idea 类；
    // 运行时通过 plugin.xml 的可选依赖加载，未安装时不影响插件运行
    plugins = ['Git4Idea']
    instrumentCode = false
}

patchPluginXml {

    sinceBuild = '223.0'
    untilBuild = "262.*"

    changeNotes = """
      <ul>
        <li>版本支持到 2026.2</li>
        <li>新增书签时，显示当前所属的分组</li>
      </ul>
    """
}

tasks.named('initializeIntelliJPlugin') {
    enabled = false
}

// 禁止过期方法的校验
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-deprecation'
}

test {
    useJUnitPlatform()
}

// 插件兼容性校验
// 用 `./gradlew runPluginVerifier` 跑（`verifyPlugin` 只是描述符配置检查，不是真正的校验）。
// IDE 发行版统一放在本机固定目录，不散落到 Gradle 缓存里：
//   - 已解压的同名目录（IC-2022.2 等）会被直接复用，不会重新下载
//   - 新增版本（如 IC-2026.1）只需加进 ideVersions，下载目标同样是这个目录
// 注意：该任务需要联网取 https://www.jetbrains.com/updates/updates.xml 版本清单，
// 加 --offline 会失败；编译与测试不受影响，可以照常离线跑
runPluginVerifier {
    downloadDir = 'D:/jetbrains-ides/pluginVerifier/ides'
    ideVersions = ['IC-2022.2', 'IC-2023.2', 'IC-2024.3', 'IC-2025.1']
    verificationReportsDir = 'build/reports/pluginVerifier'
    // 项目存在既有的弃用 API 调用（BookmarkTipPanel 的 DocumentationComponent、
    // MySettingsPanel 的 commons-lang StringUtils 等），不因弃用告警中断构建；
    // 真正的兼容性缺陷、插件结构问题、缺失依赖仍视为失败
    failureLevel = [
            FailureLevel.COMPATIBILITY_PROBLEMS,
            FailureLevel.INVALID_PLUGIN,
            FailureLevel.MISSING_DEPENDENCIES,
            FailureLevel.PLUGIN_STRUCTURE_WARNINGS,
            FailureLevel.NOT_DYNAMIC,
    ]
}

runIde {
//    jvmArgs = ['-Duser.language=en', '-Duser.country=US']
//    国际化测试
    jvmArgs = ['-Duser.language=ja', '-Duser.country=JP']
}
